<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lilypond sidecar{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --accent: #2f5d50;
      --card: #fff;
      --border: #d8d2c4;
      --warn: #8a4b1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: radial-gradient(ellipse at top left, #ebe6da, var(--bg));
      color: var(--ink);
      line-height: 1.45;
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.7);
    }
    header a { color: var(--accent); text-decoration: none; font-weight: 600; }
    header nav { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
    header .brand { font-size: 1.25rem; letter-spacing: 0.02em; }
    main { max-width: 52rem; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.75rem; }
    h2 { font-size: 1.15rem; margin: 1.5rem 0 0.5rem; }
    p, li { color: var(--ink); }
    .muted { color: var(--muted); font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.15rem;
      margin: 1rem 0;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.45rem 0.35rem; border-bottom: 1px solid var(--border); }
    th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    input[type="number"] {
      width: 5.5rem;
      padding: 0.35rem 0.45rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font: inherit;
    }
    button, .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 0.9rem;
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    button.secondary, .btn.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    button.danger { background: var(--warn); }
    pre {
      background: #1e1e1e;
      color: #e8e8e8;
      padding: 0.85rem;
      border-radius: 4px;
      overflow: auto;
      font-size: 0.8rem;
    }
    .ok { color: var(--accent); font-weight: 600; }
    .bad { color: #a12; font-weight: 600; }
    ul.plain { list-style: none; padding: 0; }
    ul.plain li { margin: 0.4rem 0; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="/">Lilypond sidecar</a>
      <a href="/display-order">Display order</a>
      <a href="/health">Health (JSON)</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
